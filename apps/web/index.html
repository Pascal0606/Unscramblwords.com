  <!-- Google tag (gtag.js), one shared load, configured for both the
       Google Ads conversion ID and the GA4 property. Previously this was
       two entirely separate <script src="gtag/js?id=..."> tags, one per
       ID, each bootstrapping its own full copy of the gtag library.
       Confirmed via a Lighthouse treemap that this caused a second,
       near-duplicate ~157 KiB fetch (the same ID, plus auto-appended
       cx/gtm linking parameters) once the two separately-loaded copies
       detected each other's config and initiated cross-account linking.
       Google's own documentation for using multiple products together
       is to load the library once and call gtag('config', ...) per ID
       from one shared setup, as below; this removes the duplicate
       load entirely rather than just working around it. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0DB2M1X245"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0DB2M1X245');
      gtag('config', 'AW-18340977733');
  </script>
